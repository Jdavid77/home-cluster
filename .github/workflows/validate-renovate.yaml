# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Validate Renovate

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - renovate.json
      - .renovate/**
      - .github/workflows/validate-renovate.yaml
  push:
    branches:
      - main
    paths:
      - renovate.json
      - .renovate/**
      - .github/workflows/validate-renovate.yaml

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.198.3

jobs:
  validate:
    name: Renovate Config Validation
    runs-on: home-ops-runner
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # just to install node
      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false

      # Checks each file on its own; does not fetch presets in `extends`
      - name: Validate Config
        run: >-
          mise exec node@24.11 --
          npx --yes --package "renovate@${RENOVATE_VERSION}" --
          renovate-config-validator --strict --no-global
          renovate.json .renovate/*.json

      # Fetches and merges all presets in `extends`; fails if one is missing or invalid.
      # Self-referenced .renovate/*.json presets are fetched from main, not this PR.
      - name: Resolve Presets
        env:
          RENOVATE_TOKEN: ${{ github.token }}
        run: >-
          mise exec node@24.11 --
          npx --yes --package "renovate@${RENOVATE_VERSION}" --
          renovate --platform=local --dry-run=extract
