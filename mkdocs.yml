site_name: home-cluster
site_description: Documentation for my home Kubernetes cluster
site_url: https://docs.jnobrega.com/
repo_url: https://github.com/Jdavid77/home-cluster
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.indexes
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Talos: talos.md
  - GitOps:
      - gitops/index.md
      - Components: gitops/components.md
  - Migrations:
      - NFS to one share: migrations/nfs-single-share.md
      - Obsidian B2 to R2: migrations/obsidian-b2-to-r2.md
      - OMV compose to its own repo: migrations/omv-compose-repo.md
