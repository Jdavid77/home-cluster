---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
extraArgs:
  enable-aggregator-routing: true
  feature-gates: ImageVolume=true,MutatingAdmissionPolicy=true,ResourceHealthStatus=true,ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
  runtime-config: admissionregistration.k8s.io/v1beta1=true,certificates.k8s.io/v1beta1/clustertrustbundles=true,certificates.k8s.io/v1beta1/podcertificaterequests=true
certExtraSANs:
  - "127.0.0.1"
