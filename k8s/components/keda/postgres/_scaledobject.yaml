# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${APP}
spec:
  cooldownPeriod: ${COOLDOWN_PERIOD:=300}
  minReplicaCount: ${MIN_REPLICAS:=0}
  maxReplicaCount: ${MAX_REPLICAS:=1}
  advanced:
    restoreToOriginalReplicaCount: true
    scalingModifiers:
      formula: "trig_postgres * ${MAX_REPLICAS:=1}"
      target: "1"
      activationTarget: "0"
  scaleTargetRef:
    apiVersion: apps/v1
    kind: ${CONTROLLER:=Deployment}
    name: ${APP}
  triggers:
    - name: trig_postgres
      type: postgresql
      metadata:
        query: "SELECT 1"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
      authenticationRef:
        name: ${APP}-pg-auth
