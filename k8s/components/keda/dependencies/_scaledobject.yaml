# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${APP}
spec:
  cooldownPeriod: ${COOLDOWN_PERIOD:=300}
  # any dependency down -> 0; all up -> exactly REPLICAS
  idleReplicaCount: 0
  minReplicaCount: ${REPLICAS:=1}
  maxReplicaCount: ${REPLICAS:=1}
  advanced:
    restoreToOriginalReplicaCount: true
  scaleTargetRef:
    apiVersion: apps/v1
    kind: ${CONTROLLER:=Deployment}
    name: ${APP}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
        # 1 only when every probe listed in DEPENDS_ON is up
        query: min(max_over_time(probe_success{job=~"probe/monitoring/(${DEPENDS_ON})"}[1m]))
        threshold: "1"
        activationThreshold: "0"
        ignoreNullValues: "0"
