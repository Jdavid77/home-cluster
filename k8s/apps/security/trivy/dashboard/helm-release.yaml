# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator-dashboard
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: trivy-operator-dashboard
    namespace: flux-system
  maxHistory: 2
  values:
    gitHub:
      serverCheckForUpdates: false
    fileRepository:
      enabled: true
      pvcName: "trivy-operator-pvc"
      basePath: "/var/lib/trivy-operator"
    nodeSelector:
      kubernetes.io/hostname: localstorage-worker1
    history:
      enabled: false
    ingress:
      enabled: false
    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 10000
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 384Mi
