# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/policies.kyverno.io/mutatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: remove-cpu-limit
  annotations:
    policies.kyverno.io/title: Remove CPU limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      This policy removes CPU limits from all Pods.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: not-ignored
      expression: >-
        !has(object.metadata.annotations) ||
        object.metadata.annotations[?'kyverno.io/ignore'].orValue('') != 'true'
  variables:
    - name: containers
      expression: object.spec.containers
    - name: initContainers
      expression: "has(object.spec.initContainers) ? object.spec.initContainers : []"
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          lists.range(size(variables.containers))
            .filter(i, 'cpu' in variables.containers[i].?resources.?limits.orValue({}))
            .map(i, JSONPatch{op: "remove", path: "/spec/containers/" + string(i) + "/resources/limits/cpu"}) +
          lists.range(size(variables.initContainers))
            .filter(i, 'cpu' in variables.initContainers[i].?resources.?limits.orValue({}))
            .map(i, JSONPatch{op: "remove", path: "/spec/initContainers/" + string(i) + "/resources/limits/cpu"})
