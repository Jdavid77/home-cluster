# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app amd-gpu-labeller
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  values:
    defaultPodOptions:
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/hostname: hp-worker3
    controllers:
      amd-gpu-labeller:
        type: daemonset
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/rocm/k8s-device-plugin
              tag: labeller-1.31.0.11@sha256:96378efd57d28e8b9cb44ba8fe58812ca18c3a45733f0f7daae171c3dcb6eac2
            workingDir: /root
            command: ["./k8s-node-labeller"]
            args: ["-vram", "-cu-count", "-simd-count", "-device-id", "-family", "-product-name"]
            env:
              DS_NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            securityContext:
              privileged: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
        pod:
          automountServiceAccountToken: true
    persistence:
      sys:
        type: hostPath
        hostPath: /sys
        globalMounts:
          - path: /sys
            readOnly: true
      dev:
        type: hostPath
        hostPath: /dev
        globalMounts:
          - path: /dev
    serviceAccount:
      *app : {}
    rbac:
      roles:
        *app :
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["nodes"]
              verbs: ["watch", "get", "list", "update"]
      bindings:
        *app :
          type: ClusterRoleBinding
          roleRef:
            identifier: *app
          subjects:
            - identifier: *app
