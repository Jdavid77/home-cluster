apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-gpu
spec:
  interval: 15m
  timeout: 5m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: intel-device-plugins-gpu
    namespace: flux-system
  values:
    name: intel-gpu-plugin
    sharedDevNum: 2
    nodeFeatureRule: false
    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: "true"