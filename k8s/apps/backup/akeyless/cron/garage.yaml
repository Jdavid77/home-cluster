# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/garage.rajsingh.info/garagebucket_v1beta1.json
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: akeyless-backups
  namespace: backup
spec:
  clusterRef:
    name: garage
    namespace: storage
  # adopted from terraform/garage
  bucketId: 4e42bb9f8bde28097be9d2d32de3e5e35817e66c82d743b6a2974b50e17ef9e0
  deletionPolicy: Retain
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/garage.rajsingh.info/garagekey_v1beta1.json
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: akeyless-backup
  namespace: backup
spec:
  clusterRef:
    name: garage
    namespace: storage
  secretTemplate:
    name: akeyless-backup-s3
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    # endpoint and region are set in the HelmRelease
    includeEndpoint: false
    includeRegion: false
  bucketPermissions:
    - bucketRef:
        name: akeyless-backups
      read: true
      write: true
