# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret akeyless-backup-secret
  namespace: backup
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *secret
    template:
      engineVersion: v2
      data:
        AKEYLESS_ACCESS_ID: "{{ .AKEYLESS_ACCESS_ID }}"
        AKEYLESS_ACCESS_KEY: "{{ .AKEYLESS_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: /akeyless/key
