# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name substrate-postgres-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      engineVersion: v2
      data:
        POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        SUBSTRATE_OWNER_PASS: "{{ .SUBSTRATE_OWNER_PASS }}"
        SUBSTRATE_READWRITE_PASS: "{{ .SUBSTRATE_READWRITE_PASS }}"
  dataFrom:
    - extract:
        key: /substrate/db
