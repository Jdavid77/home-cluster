---
# Provisions substrate's roles, login users and schema in the substrate database.
# setup.sql is idempotent and must run in a single transaction.
apiVersion: batch/v1
kind: Job
metadata:
  name: substrate-db-init
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: substrate-db-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: &image docker.io/library/postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
          command: ["/bin/sh", "-c", "until pg_isready; do sleep 2; done"]
          env: &env
            - name: PGHOST
              value: substrate-postgres.ate-system.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: substrate
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: substrate-postgres-secret
                  key: POSTGRES_SUPER_PASS
            - name: SUBSTRATE_OWNER_PASS
              valueFrom:
                secretKeyRef:
                  name: substrate-postgres-secret
                  key: SUBSTRATE_OWNER_PASS
            - name: SUBSTRATE_READWRITE_PASS
              valueFrom:
                secretKeyRef:
                  name: substrate-postgres-secret
                  key: SUBSTRATE_READWRITE_PASS
      containers:
        - name: db-init
          image: *image
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              psql --no-psqlrc -v ON_ERROR_STOP=1 --single-transaction \
                --set=substrate_schema=substrate \
                --set=substrate_owner_role=substrate_owner \
                --set=substrate_owner_user=substrate_owner_user \
                --set=substrate_owner_password="$SUBSTRATE_OWNER_PASS" \
                --set=substrate_readwrite_role=substrate_readwrite \
                --set=substrate_readwrite_user=substrate_readwrite_user \
                --set=substrate_readwrite_password="$SUBSTRATE_READWRITE_PASS" \
                --file /setup/setup.sql
          env: *env
          volumeMounts:
            - name: setup
              mountPath: /setup
              readOnly: true
      volumes:
        - name: setup
          configMap:
            name: substrate-db-setup
