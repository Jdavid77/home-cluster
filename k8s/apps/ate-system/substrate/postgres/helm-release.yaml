# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app substrate-postgres
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  values:
    controllers:
      substrate-postgres:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/postgres
              tag: 18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
            env:
              POSTGRES_DB: substrate
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: substrate-postgres-secret
                    key: POSTGRES_SUPER_PASS
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "postgres", "-d", "substrate"]
                  periodSeconds: 10
                  failureThreshold: 6
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          labels:
            app: postgres
          nodeSelector:
            kubernetes.io/hostname: localstorage-worker1
        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 5Gi
              storageClass: openebs-hostpath
              globalMounts:
                - path: /var/lib/postgresql
    service:
      app:
        controller: *app
        ports:
          postgres:
            port: 5432
