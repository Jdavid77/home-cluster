apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app substrate
  namespace: ate-system
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: *app
    namespace: flux-system
  values:

    createNamespace: false

    rustfs:
      enabled: false

    credentialProvider:
      namespacePolicies: []

    atelet:
      gcpAuthForImagePulls: false
      storageBackend: s3
      extraArgs: []
      extraEnv:
        - name: AWS_ENDPOINT_URL
          value: http://garage.storage.svc.cluster.local:3900
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: substrate-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: substrate-secret
              key: AWS_SECRET_ACCESS_KEY

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: postgres
            patch: |-
              - op: add
                path: /spec/volumeClaimTemplates/0/spec/storageClassName
                value: openebs-hostpath
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  kubernetes.io/hostname: localstorage-worker1