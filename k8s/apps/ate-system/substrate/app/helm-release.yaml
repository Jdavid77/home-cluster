# pace":"automation","name":"k8s-agent-k8s-agent-b3a998e17c8a"},"err":"while resuming golden actor: workflow failed at step CallAteletRestore: while creating workl
# oad from spec: rpc error: code = Internal desc = while populating system-info volume \"egress-trust\": while collecting volume contents: system-info projection \
