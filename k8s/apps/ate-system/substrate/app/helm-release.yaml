# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app substrate
  namespace: ate-system
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: *app
    namespace: flux-system
  values:

    createNamespace: false

    preview:
      - PerTemplateSnapshotLocation
      - GoldenEgressPolicy

    postgres:
      # Project database login certificates only when the connection strings use them.
      clientCertificates:
        enabled: false
      # Read the read/write connection string from a pre-created Secret.
      readWriteConnectionStringSecretRef:
        name: substrate-secret
        key: readWriteConnectionString
      # Read the owner connection string from a pre-created Secret.
      ownerConnectionStringSecretRef:
        name: substrate-secret
        key: ownerConnectionString
      # Roles assumed on each connection. Use distinct roles for installs sharing a database.
      readWriteRole: substrate_readwrite
      ownerRole: substrate_owner
      schema: substrate

    rustfs:
      enabled: false

    # The ate-api-server's objectstore-plugin (credential exchange) needs the same
    # Garage settings as substrate-atelet; without them it falls back to AWS and
    # snapshot uploads time out (GoldenActorCrashed).
    objectStorePlugin:
      extraEnv:
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_ENDPOINT_URL
          value: http://garage.storage.svc.cluster.local:3900
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: substrate-atelet-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: substrate-atelet-secret
              key: AWS_SECRET_ACCESS_KEY

    atelet:
      enabled: false

    ateApi:
      snapshotLocation: "gs://agent-snapshots/"
      logLevel: info
      authorization:
        # kagent-controller must own its actors, otherwise agents fail with
        # RuntimePreparationFailed (PermissionDenied).
        bootstrapOwners:
          - spiffe://cluster.local/ns/automation/sa/kagent-controller
          - system:serviceaccount:ate-system:ate-client

    atenetRouter:
      # Lets kagent-controller reach agents through the router.
      ingressAllowedSPIFFEIDs:
        - spiffe://cluster.local/ns/automation/sa/kagent-controller

    credentialProvider:
      # Default-deny: agents in the kagent atespace may read Secrets in automation.
      namespacePolicies:
        - atespace: automation
          allowedNamespaces: [automation]