apiVersion: v1
kind: ServiceAccount
metadata:
  name: substrate-ca-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: substrate-ca-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: substrate-ca-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: substrate-ca-bootstrap
subjects:
  - kind: ServiceAccount
    name: substrate-ca-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: substrate-ca-bootstrap
  namespace: podcertificate-controller-system
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: substrate-ca-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap-ca-pools
          image: golang:1.26
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp
            - name: GOCACHE
              value: /tmp/go-cache
            - name: GOPATH
              value: /tmp/go-path
            - name: POD_NAMESPACE
              value: podcertificate-controller-system
          command:
            - sh
            - -c
            - |-
              set -e
              git clone --depth 1 --branch v0.0.10 \
                https://github.com/kagent-dev/substrate /tmp/substrate-src
              cd /tmp/substrate-src
              for pool in service-dns-ca-pool:service-dns pod-identity-ca-pool:pod-identity; do
                name="${pool%%:*}"
                id="${pool##*:}"
                echo "Ensuring CA pool secret ${name}..."
                if out=$(go run ./cmd/kubectl-ate admin make-ca-pool \
                  --name="${name}" --secret-namespace="${POD_NAMESPACE}" --ca-id="${id}" 2>&1); then
                  echo "${out}"
                elif echo "${out}" | grep -qi "already exists"; then
                  echo "  ${name} already exists, skipping"
                else
                  echo "${out}"
                  exit 1
                fi
              done
