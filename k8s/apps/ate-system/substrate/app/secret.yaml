# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name substrate-secret
  namespace: ate-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .GARAGE_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .GARAGE_KEY_SECRET }}"
        # Consumed by ate-api-server
        ownerConnectionString: "host=192.168.1.84 port=5432 dbname=kagent user=substrate_owner_user password={{ .SUBSTRATE_OWNER_PASS }} sslmode=disable"
        readWriteConnectionString: "host=192.168.1.84 port=5432 dbname=kagent user=substrate_readwrite_user password={{ .SUBSTRATE_READWRITE_PASS }} sslmode=disable"
  dataFrom:
    - extract:
        key: /garage/key
    - extract:
        key: /substrate/db
