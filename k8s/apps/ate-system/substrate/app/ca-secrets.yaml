# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
# Akeyless path: /substrate/actor-id-ca-pool
# Bootstrap:
#   kubectl ate admin make-ca-pool \
#     --name actor-id-ca-pool \
#     --secret-namespace default \
#     --ca-id "1" \
#     -o yaml
# Extract value:
#   kubectl get secret actor-id-ca-pool -n default -o jsonpath='{.data.pool}' | base64 -d
# Cleanup:
#   kubectl delete secret actor-id-ca-pool -n default
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-ca-pool
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: actor-id-ca-pool
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
  dataFrom:
    - extract:
        key: /substrate/actor-id-ca-pool
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
# Akeyless path: /substrate/actor-id-jwt-pool
# Bootstrap:
#   kubectl ate admin make-jwt-pool \
#     --name actor-id-jwt-pool \
#     --secret-namespace default \
#     --key-id "1" \
#     -o yaml
# Extract value:
#   kubectl get secret actor-id-jwt-pool -n default -o jsonpath='{.data.pool}' | base64 -d
# Cleanup:
#   kubectl delete secret actor-id-jwt-pool -n default
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-jwt-pool
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: actor-id-jwt-pool
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
  dataFrom:
    - extract:
        key: /substrate/actor-id-jwt-pool
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
# Akeyless path: /substrate/actor-id-ca-certs
# Derived from actor-id-ca-pool (bootstrapped in default ns) — extract the PEM root cert:
#   kubectl get secret actor-id-ca-pool -n default -o jsonpath='{.data.pool}' | base64 -d \
#     | python3 -c "
#         import sys, json, base64
#         pool = json.load(sys.stdin)
#         for ca in pool['CAs']:
#             der = base64.b64decode(ca['RootCertificateDER'])
#             print('-----BEGIN CERTIFICATE-----')
#             print(base64.encodebytes(der).decode().strip())
#             print('-----END CERTIFICATE-----')
#       "
# Store the PEM output as field: ca_crt
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actor-id-ca-certs
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: actor-id-ca-certs
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
  dataFrom:
    - extract:
        key: /substrate/actor-id-ca-certs
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
# Akeyless path: /substrate/egress-mitm-ca-pool
# CA atenet-egress uses to intercept actor HTTPS egress (mounts tls.crt / tls.key).
# Bootstrap:
#   kubectl ate admin make-ca-pool \
#     --name egress-mitm-ca-pool \
#     --secret-namespace default \
#     --ca-id "1" \
#     -o yaml
# Extract value (store the whole object, keys pool, tls.crt, tls.key):
#   kubectl get secret egress-mitm-ca-pool -n default -o json \
#     | jq -c '.data | map_values(@base64d)'
# Cleanup:
#   kubectl delete secret egress-mitm-ca-pool -n default
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: egress-mitm-ca-pool
  namespace: ate-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: egress-mitm-ca-pool
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: kubernetes.io/tls
      engineVersion: v2
  dataFrom:
    - extract:
        key: /substrate/egress-mitm-ca-pool
