# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
# Akeyless path: /substrate/service-dns-ca-pool
# Bootstrap:
#   kubectl ate admin make-ca-pool \
#     --name service-dns-ca-pool \
#     --secret-namespace default \
#     --ca-id "1" \
#     -o yaml
# Extract value:
#   kubectl get secret service-dns-ca-pool -n default -o jsonpath='{.data.pool}' | base64 -d
# Cleanup:
#   kubectl delete secret service-dns-ca-pool -n default
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: service-dns-ca-pool
  namespace: podcertificate-controller-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: service-dns-ca-pool
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
  dataFrom:
    - extract:
        key: /substrate/service-dns-ca-pool
