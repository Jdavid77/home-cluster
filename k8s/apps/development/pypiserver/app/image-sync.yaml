# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/image.toolkit.fluxcd.io/imagerepository_v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: pypiserver
spec:
  image: registry.jnobrega.com/mirror/pypiserver/pypiserver
  interval: 5m
  provider: generic
  secretRef:
    name: zot-registry-secret
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/image.toolkit.fluxcd.io/imagepolicy_v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: &repo pypiserver
spec:
  imageRepositoryRef:
    name: *repo
  policy:
    semver:
      range: '>=2.4.0'
