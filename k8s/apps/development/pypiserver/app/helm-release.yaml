# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pypiserver
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  values:
    defaultPodOptions:
      imagePullSecrets:
        - name: zot-registry-secret
    controllers:
      pypiserver:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: registry.jnobrega.com/mirror/pypiserver/pypiserver
              tag: v2.4.2 # {"$imagepolicy": "development:pypiserver:tag"}
            args:
              - run
              - --port=8080
              - --passwords=/data/.htpasswd
              - --authenticate=update,download,list
              - --health-endpoint=/health
              - /data/packages
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
        pod:
          securityContext:
            runAsUser: 1002
            runAsGroup: 100
            runAsNonRoot: true
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      main:
        parentRefs:
          - kind: Gateway
            name: external
            namespace: network
            sectionName: websecure
        hostnames:
          - pypi.jnobrega.com
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      packages:
        type: nfs
        server: 192.168.1.84
        path: /pypi
        globalMounts:
          - path: /data/packages
      htpasswd:
        type: secret
        name: pypiserver-secret
        globalMounts:
          - path: /data/.htpasswd
            subPath: htpasswd
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
