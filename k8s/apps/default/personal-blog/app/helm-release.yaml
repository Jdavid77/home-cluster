# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app personal-blog
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gh-secret
    controllers:
      *app:
        pod:
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            fsGroup: 101
        containers:
          app:
            image:
              repository: ghcr.io/jdavid77/personal-blog
              tag: v2026.08.22.02 # {"$imagepolicy": "default:personal-blog:tag"}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 50M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8080
    route:
      main:
        parentRefs:
          - kind: Gateway
            name: external
            namespace: network
            sectionName: websecure
        hostnames:
          - blog.jnobrega.com
        rules:
          - backendRefs:
              - name: *app
                port: *port
