# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kubernetes-live-metrics-dashboard
  namespace: flux-system
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
    controllers:
      *app:
        replicas: 1
        strategy: RollingUpdate
        containers:
          backend:
            image:
              repository: ghcr.io/jdavid77/kubernetes-live-metrics-dashboard-backend
              tag: v2026.11.23.03 # {"$imagepolicy": "default:kubernetes-live-metrics-dashboard-backend:tag"}
            env:
              CORS_ORIGIN: https://live.jnobrega.com
              PORT: "8000"
            probes:
              liveness: &probes
                enabled: false
              readiness: *probes
              startup: *probes
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              limits:
                memory: 75Mi
              requests:
                cpu: 50m
          frontend:
            image:
              repository: ghcr.io/jdavid77/kubernetes-live-metrics-dashboard-frontend
              tag: v2026.11.23.03 # {"$imagepolicy": "default:kubernetes-live-metrics-dashboard-frontend:tag"}
            probes:
              liveness: &probes
                enabled: false
              readiness: *probes
              startup: *probes
            securityContext:
              runAsNonRoot: true
              runAsUser: 101
              runAsGroup: 101
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              limits:
                memory: 150Mi
              requests:
                cpu: 50m
    persistence:
      config:
        type: configMap
        name: live-metrics-config
        advancedMounts:
          *app:
            frontend:
              - path: /usr/share/nginx/html/config
                readOnly: true
    service:
      main:
        controller: *app
        ports:
          http:
            port: &port 8080
    route:
      main:
        parentRefs:
          - kind: Gateway
            name: external
            namespace: network
            sectionName: websecure
        hostnames:
          - live.jnobrega.com
        rules:
          - backendRefs:
              - name: *app
                port: *port
    serviceAccount:
      *app:
        enabled: true
    rbac:
      roles:
        live-metrics-role:
          enabled: true
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["pods", "nodes", "services"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["networking.k8s.io"]
              resources: ["ingresses"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["gateways", "httproutes"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["metrics.k8s.io"]
              resources: ["pods", "nodes"]
              verbs: ["get", "list"]
      bindings:
        live-metrics-binding:
          enabled: true
          type: ClusterRoleBinding
          roleRef:
            kind: ClusterRole
            identifier: live-metrics-role
          subjects:
            - identifier: *app
