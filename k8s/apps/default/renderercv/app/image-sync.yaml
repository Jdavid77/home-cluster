# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/image.toolkit.fluxcd.io/imagerepository_v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: rendercv
spec:
  image: registry.jnobrega.com/mirror/rendercv
  interval: 5m
  provider: generic
  serviceAccountName: rendercv-image-scan
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/image.toolkit.fluxcd.io/imagepolicy_v1.json
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: &repo rendercv
spec:
  imageRepositoryRef:
    name: *repo
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+)$'
    extract: "$${version}.0"
  policy:
    semver:
      range: '>=2.0.0'
---
# zot maps this SA's token to a read-only identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rendercv-image-scan
  annotations:
    credential.auth.fluxcd.io/provider: kubernetes
    credential.auth.fluxcd.io/type: jwt
    credential.auth.fluxcd.io/audiences: zot
    credential.auth.fluxcd.io/username: zot
