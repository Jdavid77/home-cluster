# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omv
spec:
  hostnames:
    - omv.jnobrega.com
  parentRefs:
    - kind: Gateway
      name: internal
      namespace: network
      sectionName: websecure
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: omv
          port: 80
