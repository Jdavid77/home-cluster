# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-mirror
  namespace: storage
spec:
  interval: 15m
  timeout: 5m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
    controllers:
      flux-mirror:
        type: cronjob
        cronjob:
          suspend: false
          concurrencyPolicy: Forbid
          timeZone: Europe/Lisbon
          schedule: "0 0 * * *"
          startingDeadlineSeconds: 30
          successfulJobsHistory: 1
          failedJobsHistory: 1
          backoffLimit: 3
          parallelism: 0
          # also cleans up manually triggered runs, which history limits don't
          ttlSecondsAfterFinished: 86400
        initContainers:
          docker-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command: ["/bin/sh", "-c"]
            args:
              - |
                auth=$(printf 'zot:%s' "$(cat /var/run/secrets/zot/token)" | base64 -w0)
                printf '{"auths":{"registry.jnobrega.com":{"auth":"%s"}}}' "$auth" > /docker/config.json
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: ghcr.io/fluxcd/flux-mirror
              tag: v0.17.0@sha256:295d2afd15c8d631f86ac0b2aedba8e4f06e0d04a600473b8660e12d9fe8b5bc
            args:
              - sync
              - /config/mirror.yaml
              - --no-progress
              - --drift-exit-code=0
            env:
              DOCKER_CONFIG: /docker
              MIRROR_REGISTRY: registry.jnobrega.com/mirror
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 1Gi
    persistence:
      config:
        type: configMap
        name: flux-mirror-config
        globalMounts:
          - path: /config/mirror.yaml
            subPath: mirror.yaml
            readOnly: true
      docker-config:
        type: emptyDir
        globalMounts:
          - path: /docker
      # push identity: zot maps this token to system:serviceaccount:storage:flux-mirror
      zot-token:
        type: custom
        volumeSpec:
          projected:
            sources:
              - serviceAccountToken:
                  audience: zot
                  expirationSeconds: 21600
                  path: token
        globalMounts:
          - path: /var/run/secrets/zot
            readOnly: true
    serviceAccount:
      flux-mirror: {}
