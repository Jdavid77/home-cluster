# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helm-release.yaml
configMapGenerator:
  - name: flux-mirror-config
    files:
      - mirror.yaml=https://raw.githubusercontent.com/Jdavid77/artifacts-mirror/refs/heads/main/flux-mirror.yaml
generatorOptions:
  disableNameSuffixHash: true
