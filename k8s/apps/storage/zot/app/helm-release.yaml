# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: storage
spec:
  interval: 15m
  timeout: 5m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: zot
    namespace: flux-system
  values:
    replicaCount: 3
    mountConfig: true
    configFiles:
      config.json: |
        {
          "distSpecVersion": "1.1.1",
          "storage": {
            "rootDirectory": "/tmp/zot",
            "gc": true,
            "dedupe": false,
            "retention": {
              "dryRun": false,
              "delay": "24h",
              "policies": [
                {
                  "repositories": ["**"],
                  "deleteReferrers": true,
                  "keepTags": [
                    {
                      "mostRecentlyPushedCount": 5
                    }
                  ]
                }
              ]
            },
            "storageDriver": {
              "name": "s3",
              "region": "us-east-1",
              "bucket": "zot",
              "regionendpoint": "http://garage.storage.svc.cluster.local:3900",
              "secure": false,
              "skipverify": true
            }
          },
          "http": {
            "address": "0.0.0.0",
            "port": "5000",
            "readTimeout": "300s",
            "writeTimeout": "300s",
            "externalUrl": "https://registry.jnobrega.com",
            "compat": ["docker2s2"],
            "auth": {
              "htpasswd": {
                "path": "/secret/htpasswd"
              },
              "bearer": {
                "realm": "https://registry.jnobrega.com/zot/auth/token",
                "service": "registry.jnobrega.com",
                "oidc": [
                  {
                    "issuer": "https://192.168.1.110:6443",
                    "audiences": ["zot"],
                    "certificateAuthorityFile": "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  }
                ]
              }
            },
            "accessControl": {
              "repositories": {
                "**": {
                  "policies": [
                    {
                      "users": [
                        "https://192.168.1.110:6443/system:serviceaccount:storage:zot-pull",
                        "https://192.168.1.110:6443/system:serviceaccount:automation:n8n-mcp-image-scan",
                        "https://192.168.1.110:6443/system:serviceaccount:default:rendercv-image-scan",
                        "https://192.168.1.110:6443/system:serviceaccount:development:pypiserver-image-scan",
                        "https://192.168.1.110:6443/system:serviceaccount:media:grimmory-image-scan",
                        "https://192.168.1.110:6443/system:serviceaccount:media:shelfmark-image-scan"
                      ],
                      "actions": ["read"]
                    },
                    {
                      "users": ["https://192.168.1.110:6443/system:serviceaccount:storage:flux-mirror"],
                      "actions": ["read", "create", "update", "delete"]
                    }
                  ]
                }
              },
              "adminPolicy": {
                "users": ["admin"],
                "actions": ["read", "create", "update", "delete"]
              }
            }
          },
          "log": {
            "level": "info"
          },
          "extensions": {
            "ui": { "enable": true },
            "search": { "enable": true },
            "scrub": { "enable": true, "interval": "24h" }
          }
        }
    mountSecret: true
    secretFiles:
      htpasswd: |-
        admin:$2y$05$PAt5S8lT65jElESxVpaH/uzyFBgbAkRETa5sl7BT94ong0iqfhcHu
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: zot-s3
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: zot-s3
            key: AWS_SECRET_ACCESS_KEY
    service:
      type: ClusterIP
    httproute:
      enabled: true
      parentRefs:
        - name: internal
          namespace: network
          sectionName: websecure
      hostnames:
        - "registry.jnobrega.com"
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          sessionPersistence:
            sessionName: zot-registry-session
            type: Cookie
            absoluteTimeout: 30m
            cookieConfig:
              lifetimeType: Permanent
    persistence: false
