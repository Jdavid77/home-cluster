# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: storage
spec:
  interval: 15m
  timeout: 5m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: zot
    namespace: flux-system
  values:
    replicaCount: 1
    mountConfig: true
    # config lives in ./config/config.json (configMapGenerator); null stops the chart creating its own
    configFiles: null
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    mountSecret: true
    secretFiles:
      htpasswd: |-
        admin:$2y$05$PAt5S8lT65jElESxVpaH/uzyFBgbAkRETa5sl7BT94ong0iqfhcHu
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: zot-s3
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: zot-s3
            key: AWS_SECRET_ACCESS_KEY
    service:
      type: ClusterIP
    httproute:
      enabled: true
      parentRefs:
        - name: internal
          namespace: network
          sectionName: websecure
      hostnames:
        - "registry.jnobrega.com"
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
    persistence: false
