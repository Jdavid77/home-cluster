# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helm-release.yaml
  - ./rbac.yaml
  - ./secret.yaml
  - ./service.yaml
  - ./token-rotator.yaml
components:
  - ../../../../components/keda/nfs
# 2 replicas while nfs is up, 0 when it's down (here, not in ks.yaml: cluster.yaml overwrites ks patches)
patches:
  - target:
      kind: ScaledObject
    patch: |
      - op: add
        path: /spec/idleReplicaCount
        value: 0
configMapGenerator:
  - name: zot-config
    files:
      - ./config/config.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    # helm created this cm before; stops helm deleting it on upgrade
    helm.sh/resource-policy: keep
