---
# identity used by kubelet/flux/trivy to pull from zot (read-only in zot accessControl)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot-pull
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot-token-rotator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zot-token-rotator
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["zot-pull"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zot-registry-secret"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zot-token-rotator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zot-token-rotator
subjects:
  - kind: ServiceAccount
    name: zot-token-rotator
---
# mints a 24h zot-pull token every 6h into zot-registry-secret
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zot-token-rotator
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: zot-token-rotator
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: rotate
              image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  token=$(kubectl create token zot-pull --audience zot --duration 24h)
                  auth=$(printf 'zot:%s' "$token" | base64 -w0)
                  config=$(printf '{"auths":{"registry.jnobrega.com":{"auth":"%s"}}}' "$auth" | base64 -w0)
                  kubectl patch secret zot-registry-secret --type merge -p "{\"data\":{\".dockerconfigjson\":\"$config\"}}"
              env:
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: tmp
              emptyDir: {}
