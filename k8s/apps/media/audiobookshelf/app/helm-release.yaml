# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app audiobookshelf
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  values:
    controllers:
      audiobookshelf:
        replicas: 1
        containers:
          audiobookshelf:
            image:
              repository: ghcr.io/advplyr/audiobookshelf
              tag: 2.36.0@sha256:e388e90e381ae3fa8660346612b2955f2c555ede81c9c286e2218bdf966b4de8
            env:
              TZ: Europe/Lisbon
              PORT: &port 8080
              AUDIOBOOKSHELF_UID: &uid 1002
              AUDIOBOOKSHELF_GID: &gid 100
              CONFIG_PATH: /config
              METADATA_PATH: /config/metadata
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 200Mi
              limits:
                memory: 600Mi
        pod:
          securityContext:
            runAsUser: *uid
            runAsGroup: *gid
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
    service:
      audiobookshelf:
        controller: audiobookshelf
        ports:
          http:
            port: *port
    route:
      main:
        parentRefs:
          - kind: Gateway
            name: internal
            namespace: network
            sectionName: websecure
        hostnames:
          - audiobooks.jnobrega.com
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        existingClaim: audiobookshelf
      downloads:
        type: nfs
        server: 192.168.1.84
        path: /downloads
        globalMounts:
          - path: /audiobooks
