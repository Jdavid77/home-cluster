# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-embedding-0-6b
spec:
  source: https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  sha256: 06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      count: 1
      vendor: intel
      resourceName: gpu.intel.com/i915
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-embedding-0-6b
spec:
  modelRef: qwen3-embedding-0-6b
  runtime: llamacpp
  mode: embedding
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b12033@sha256:421137599beb2135a9e1d664fa8991a3f4f5f953440a9d7622c7a61b63185fe8
  env:
    - name: XDG_CACHE_HOME
      value: /tmp/.cache
  # replicas is owned by KEDA (ScaledObject below)
  contextSize: 4096
  # Non-causal pooling: a single input must fit in one ubatch, and the attention
  # score buffer grows with ubatch². 2048 caps each input at 2048 tokens (plenty
  # for RAG chunks) and saves ~1GB of shared iGPU RAM vs 8192, at the same speed.
  batchSize: 4096
  uBatchSize: 2048
  extraArgs:
    - --alias
    - qwen3-embedding
  # Request only (no CPU limit); the iGPU does the work and the node's CPU
  # requests are tight (Prometheus is pinned there).
  resources:
    gpu: 1
    cpu: 100m
    memory: 1Gi
    memoryLimit: 4Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1002
    runAsGroup: 100
    fsGroup: 100
---
# Scale-to-zero: callers use http://qwen3-embedding.automation.svc.cluster.local:8080,
# which resolves to the KEDA HTTP interceptor. It holds requests while the
# InferenceService scales up from 0, then forwards them to the real Service.
apiVersion: v1
kind: Service
metadata:
  name: qwen3-embedding
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.monitoring.svc.cluster.local
  ports:
    - port: 8080
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/http.keda.sh/interceptorroute_v1beta1.json
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: qwen3-embedding-0-6b
spec:
  target:
    service: qwen3-embedding-0-6b
    port: 8080
  rules:
    - hosts:
        - qwen3-embedding
        - qwen3-embedding.automation
        - qwen3-embedding.automation.svc
        - qwen3-embedding.automation.svc.cluster.local
  scalingMetric:
    concurrency:
      targetValue: 4
  timeouts:
    # Cold start (pod scheduling + model load) is ~16s; fail rather than hang.
    readiness: 120s
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: qwen3-embedding-0-6b
spec:
  # KEDA drives the InferenceService's /scale subresource, so the model's
  # manifest must not set spec.replicas or Flux would fight it.
  scaleTargetRef:
    apiVersion: inference.llmkube.dev/v1alpha1
    kind: InferenceService
    name: qwen3-embedding-0-6b
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 600
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.monitoring:9090
        interceptorRoute: qwen3-embedding-0-6b
