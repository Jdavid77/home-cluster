---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-4b
spec:
  source: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf
  sha256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: vulkan
      resourceName: amd.com/gpu
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-4b
spec:
  modelRef: qwen3-4b
  runtime: llamacpp
  # LLMKube's Vulkan image ships a single AVX2-only CPU backend, which the
  # i5-3470 (Ivy Bridge) can't load; upstream bundles all CPU variants.
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b12033@sha256:421137599beb2135a9e1d664fa8991a3f4f5f953440a9d7622c7a61b63185fe8
  env:
    # Mesa shader cache; HOME is / for the non-root uid.
    - name: XDG_CACHE_HOME
      value: /tmp/.cache
  replicas: 1
  # 8k spills the KV cache out of the 4GB VRAM into GTT over PCIe 3.0 x4.
  contextSize: 4096
  jinja: true
  # Vulkan flash attention is ~3x slower at prompt processing on RDNA2, and
  # llama.cpp defaults to "auto", so it must be forced off explicitly.
  extraArgs:
    - --flash-attn
    - "off"
    - --alias
    - qwen3-4b
  resources:
    gpu: 1
    cpu: "1"
    memory: 2Gi
    memoryLimit: 6Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1002
    runAsGroup: 100
    fsGroup: 100
