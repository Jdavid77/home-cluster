---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-4b
spec:
  source: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf
  sha256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      count: 1
      vendor: amd
      runtime: vulkan
      resourceName: amd.com/gpu
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-4b
spec:
  modelRef: qwen3-4b
  runtime: llamacpp
  # LLMKube's Vulkan image ships a single AVX2-only CPU backend, which the
  # i5-3470 (Ivy Bridge) can't load; upstream bundles all CPU variants.
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b12033@sha256:421137599beb2135a9e1d664fa8991a3f4f5f953440a9d7622c7a61b63185fe8
  env:
    # Mesa shader cache; HOME is / for the non-root uid.
    - name: XDG_CACHE_HOME
      value: /tmp/.cache
  # replicas is owned by KEDA (ScaledObject below)
  # 8k spills the KV cache out of the 4GB VRAM into GTT over PCIe 3.0 x4.
  contextSize: 4096
  jinja: true
  # Vulkan flash attention is ~3x slower at prompt processing on RDNA2, and
  # llama.cpp defaults to "auto", so it must be forced off explicitly.
  # Thinking mode is on by default and burns thousands of tokens before
  # answering; clients like Mealie can't send per-request template kwargs.
  extraArgs:
    - --flash-attn
    - "off"
    - --chat-template-kwargs
    - '{"enable_thinking":false}'
    - --alias
    - qwen3-4b
  resources:
    gpu: 1
    cpu: "1"
    memory: 2Gi
    memoryLimit: 6Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1002
    runAsGroup: 100
    fsGroup: 100
---
# Scale-to-zero: callers use http://qwen3.automation.svc.cluster.local:8080,
# which resolves to the KEDA HTTP interceptor. It holds requests while the
# InferenceService scales up from 0, then forwards them to the real Service.
apiVersion: v1
kind: Service
metadata:
  name: qwen3
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.monitoring.svc.cluster.local
  ports:
    - port: 8080
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/http.keda.sh/interceptorroute_v1beta1.json
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: qwen3-4b
spec:
  target:
    service: qwen3-4b
    port: 8080
  rules:
    - hosts:
        - qwen3
        - qwen3.automation
        - qwen3.automation.svc
        - qwen3.automation.svc.cluster.local
  scalingMetric:
    concurrency:
      targetValue: 4
  timeouts:
    # Cold start (pod scheduling + model load into VRAM) is ~40s; fail rather than hang.
    readiness: 120s
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/keda.sh/scaledobject_v1alpha1.json
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: qwen3-4b
spec:
  # KEDA drives the InferenceService's /scale subresource, so the manifest
  # above must not set spec.replicas or Flux would fight it.
  scaleTargetRef:
    apiVersion: inference.llmkube.dev/v1alpha1
    kind: InferenceService
    name: qwen3-4b
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 300
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.monitoring:9090
        interceptorRoute: qwen3-4b
