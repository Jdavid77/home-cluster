---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llmkube-model-cache
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
  nfs:
    server: 192.168.1.84
    path: /models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llmkube-model-cache
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: llmkube-model-cache
  resources:
    requests:
      storage: 100Gi
