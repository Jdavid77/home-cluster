# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app whisper
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: localstorage-worker1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1002
        runAsGroup: 100
        fsGroup: 100
    controllers:
      whisper:
        # Only one free i915 slot next to the embedding model; a surge pod
        # would sit Pending forever.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          download-model:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /models/whisper
                f=/models/whisper/ggml-small.bin
                [ -s "$f" ] && exit 0
                curl -fsSL --retry 3 -o "$f.tmp" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
                mv "$f.tmp" "$f"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/whisper.cpp
              tag: main-vulkan@sha256:bd869d471b0a75e95c6a4c34b4a60eabc9be9a31004baa262462ee16acc2c713
            # OpenAI-compatible transcription for Mealie: it posts mp3 to
            # /v1/audio/transcriptions and reads {"text": ...}.
            command:
              - whisper-server
            args:
              - --model
              - /models/whisper/ggml-small.bin
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              - --inference-path
              - /v1/audio/transcriptions
              - --convert
              - --tmp-dir
              - /tmp
              - --threads
              - "2"
            env:
              HOME: /tmp
              # Mesa shader cache
              XDG_CACHE_HOME: /tmp/.cache
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
                gpu.intel.com/i915: 1
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      models:
        type: nfs
        server: 192.168.1.84
        path: /models
        globalMounts:
          - path: /models
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
