# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-internal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-internal
  frontend:
    accessLog: {}
  traffic:
    timeouts:
      request: 120s
    retry:
      attempts: 2
      backoff: 250ms
      codes:
        - 502
        - 503
