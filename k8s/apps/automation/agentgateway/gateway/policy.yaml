# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm
  frontend:
    accessLog:
      attributes:
        add:
          - name: substrate.actor
            expression: jwt.sub
  traffic:
    # Actor JWTs injected by atenet-egress (EgressPolicy llm-gateway); public JWKS from https://idp.ate-system.svc/openid/v1/jwks
    jwtAuthentication:
      mode: Optional
      providers:
        - issuer: https://idp.ate-system.svc
          audiences:
            - llm-gateway
          jwks:
            inline: '{"keys":[{"kty":"EC","kid":"1","use":"sig","alg":"ES256","crv":"P-256","x":"tIuIWUv3Qe0q8rxSDa53l-MJlBO3NACFERz_BvrlknI","y":"_ffOReyuOKBrbghai9M97PsU6HjWQ-1NWVZCq6Hi7lQ"}]}'
    timeouts:
      request: 120s
    retry:
      attempts: 2
      backoff: 250ms
      codes:
        - 502
        - 503
