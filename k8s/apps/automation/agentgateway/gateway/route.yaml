# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-ui
spec:
  hostnames:
    - agentgateway.jnobrega.com
  parentRefs:
    - name: internal
      namespace: network
      sectionName: websecure
  rules:
    # Short link to the cost dashboard
    - matches:
        - path:
            type: Exact
            value: /analytics
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /ui/llm/analytics
            statusCode: 302
    - backendRefs:
        - name: llm-admin
          port: 15000
      matches:
        - path:
            type: PathPrefix
            value: /
