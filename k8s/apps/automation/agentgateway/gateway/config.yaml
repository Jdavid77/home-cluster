# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/agentgateway.dev/agentgatewayparameters_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: llm
spec:
  image:
    registry: ghcr.io
    repository: agentgateway/agentgateway
    tag: v1.7.0
    digest: sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
  # Admin UI binds to localhost by default; expose it so the agentgateway-ui route can reach it
  rawConfig:
    config:
      adminAddr: 0.0.0.0:15000
  # In-cluster only: agents reach it via atenet-egress, nothing on the LAN can
  service:
    spec:
      type: ClusterIP
  logging:
    format: json
    level: info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  deployment:
    spec:
      replicas: 2
  podDisruptionBudget:
    spec:
      minAvailable: 1
