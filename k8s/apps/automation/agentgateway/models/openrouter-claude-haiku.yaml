# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/agentgateway.dev/agentgatewaybackend_v1alpha1.json
# Chat model for kagent agents. The backend has no OpenRouter preset, so the openai provider points at openrouter.ai
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openrouter-claude-haiku
spec:
  ai:
    provider:
      openai:
        # Replaces the model clients send (kagent sends "default"); change it here to swap models without touching kagent
        model: anthropic/claude-haiku-5.5
      host: openrouter.ai
      port: 443
      path: /api/v1/chat/completions
  policies:
    auth:
      secretRef:
        name: agentgateway-openrouter
    tls:
      sni: openrouter.ai
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-chat
spec:
  parentRefs:
    - name: llm
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: openrouter-claude-haiku
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-chat
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm-chat
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm-cloudflare
  traffic:
    # Actor JWTs minted by Substrate (kagent ModelConfig actorJwt, audience llm-gateway); public JWKS from https://idp.ate-system.svc/openid/v1/jwks
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: https://idp.ate-system.svc
          audiences:
            - llm-gateway
          jwks:
            inline: '{"keys":[{"kty":"EC","kid":"1","use":"sig","alg":"ES256","crv":"P-256","x":"tIuIWUv3Qe0q8rxSDa53l-MJlBO3NACFERz_BvrlknI","y":"_ffOReyuOKBrbghai9M97PsU6HjWQ-1NWVZCq6Hi7lQ"}]}'
    # Only Substrate actors from the automation atespace (kagent agents)
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - 'jwt.sub.startsWith("actor/automation/")'
