# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentgateway-openrouter
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      engineVersion: v2
      data:
        Authorization: "{{ .OPENROUTER_API_KEY }}"
  dataFrom:
    - extract:
        key: /kagent/openrouter
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
# Client keys for the openrouter-rerank route; each entry is one key (the doc2vec MCP server holds the same value)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentgateway-rerank-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      engineVersion: v2
      data:
        doc2vec: "{{ .API_KEY }}"
  dataFrom:
    - extract:
        key: /doc2vec/rerank
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
# Cloudflare API token with only the Workers AI Read permission
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentgateway-cloudflare
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      engineVersion: v2
      data:
        Authorization: "{{ .CLOUDFLARE_API_TOKEN }}"
  dataFrom:
    - extract:
        key: /kagent/cloudflare
