apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: mcp-authentik-authn
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mcp
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
      - # The authentik issuer URL, including the trailing slash
        issuer: "https://auth.jnobrega.com/application/o/agentgateway-MCP/"
        # authentik sets the 'aud' claim to the OAuth client ID
        audiences:
        - "2051528611197305076177514453470682966907521782151600457328389209128896650981937688282404173261494"
        jwks:
          remote:
            # Reference the in-cluster authentik Service to fetch public keys
            backendRef:
              name: authentik-server
              kind: Service
              namespace: security
              port: 80
            # authentik serves JWKS at {issuer}/jwks/, not /.well-known/jwks.json
            jwksPath: "/application/o/agentgateway-MCP/jwks/"
      mcp:
        # Use the native authentik provider
        provider: Authentik
        # Required: authentik does not support Dynamic Client Registration
        clientId: "2051528611197305076177514453470682966907521782151600457328389209128896650981937688282404173261494"
        resourceMetadata:
          resource: https://mcp.jnobrega.com/mcp
          scopesSupported:
          - openid
          - profile
          bearerMethodsSupported:
          - header
    # Allow only tokens from members of the mcp-agent group
    authorization:
      action: Allow
      policy:
        matchExpressions:
        - '"mcp-agent" in jwt.groups'
