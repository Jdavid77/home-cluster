# doc2vec crawl config. The MCP server must embed queries with the same model
# and dimension, so change both together (and recreate the collections).
# The controller re-reads this file every 30s; name and schedule (cron, TZ of
# the pod) drive its scheduler.
name: AI
schedule: "0 4 * * 0"
embedding:
  provider: openai
  dimension: 1024
  openai:
    api_key: unused
    model: qwen3-embedding
    base_url: http://qwen3-embedding.automation.svc.cluster.local:8080/v1

# product_name is the product's lowercase name and version is latest: the MCP
# server picks the collection <product_name>_<version>, and the docs-search
# skill relies on that convention.
sources:
  - type: website
    product_name: agentgateway
    version: latest
    url: https://agentgateway.dev/docs/kubernetes/latest/
    sitemap_url: https://agentgateway.dev/sitemap.xml
    max_size: 2097152
    database_config:
      type: qdrant
      params:
        qdrant_url: http://qdrant.automation.svc.cluster.local
        qdrant_port: 6333
        collection_name: agentgateway_latest
        keyword_index: true
  - type: website
    product_name: llmkube
    version: latest
    url: https://llmkube.com/docs
    sitemap_url: https://llmkube.com/sitemap.xml
    max_size: 2097152
    database_config:
      type: qdrant
      params:
        qdrant_url: http://qdrant.automation.svc.cluster.local
        qdrant_port: 6333
        collection_name: llmkube_latest
        keyword_index: true
  - type: website
    product_name: kagent
    version: latest
    url: https://kagent.dev/docs/kagent/latest/
    sitemap_url: https://kagent.dev/docs/sitemap.xml
    max_size: 2097152
    database_config:
      type: qdrant
      params:
        qdrant_url: http://qdrant.automation.svc.cluster.local
        qdrant_port: 6333
        collection_name: kagent_latest
        keyword_index: true
