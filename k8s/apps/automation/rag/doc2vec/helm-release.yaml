# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app doc2vec
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  values:
    controllers:
      doc2vec:
        # One scheduler only, and a restart kills any crawl in progress
        strategy: Recreate
        annotations:
          # Secret only: the controller hot-reloads the config ConfigMap, and a
          # restart on every config change would kill a running crawl.
          secret.reloader.stakater.com/reload: doc2vec-secret
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 19.0@sha256:b49e2f1f373d932ab41614633ac89fa506e5d21bb13cc18d9c96ca026e51f502
              pullPolicy: IfNotPresent
            envFrom: &envFrom
              - secretRef:
                  name: doc2vec-secret
          # Native sidecar: crawl jobs render pages through it over CDP
          browser:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.64.2@sha256:aaedd08b2182d561152b86d77b1411462def57f84f0356d5fe40406358996d2f
            restartPolicy: Always
            env:
              # A crawl holds one session for the whole run; 0 = no limit
              TIMEOUT: "0"
              CONCURRENT: "2"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
        containers:
          app:
            image:
              repository: docker.io/library/node
              tag: 26.13.1-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
            # Read-only UI: configs come from git (the ConfigMap directory).
            # Each scheduled or manual run is a child `doc2vec run` process.
            command:
              - npx
              - --yes
              - doc2vec@2.17.5
              - controller
              - /config
            workingDir: /tmp
            env:
              TZ: Europe/Lisbon
              PORT: &port 8080
              BROWSER_WS_ENDPOINT: ws://localhost:3000
              HOME: /tmp
              # Broken-link report (404.yaml); defaults to the read-only config dir
              DOC2VEC_REPORT_DIR: /tmp
              npm_config_cache: /tmp/.npm
              npm_config_update_notifier: "false"
              # The browser runs in the sidecar
              PUPPETEER_SKIP_DOWNLOAD: "true"
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              # npx installs the package on every start (~1 min)
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1536Mi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        parentRefs:
          - kind: Gateway
            name: internal
            namespace: network
            sectionName: websecure
        hostnames:
          - doc2vec.jnobrega.com
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        type: configMap
        name: doc2vec-configs
        advancedMounts:
          doc2vec:
            app:
              - path: /config
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          doc2vec:
            app:
              - path: /tmp
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          doc2vec:
            browser:
              - path: /dev/shm
