# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/api.kagent.dev/remotemcpserver_v1alpha3.json
# Exposes the kmcp-managed MCPServer to kagent agents (AgentTemplates only accept RemoteMCPServer).
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: kubernetes-mcp
spec:
  description: Kubernetes MCP server (read-only)
  protocol: STREAMABLE_HTTP
  url: http://kubernetes-mcp.automation.svc.cluster.local:8080/mcp
