# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/kagent.dev/mcpserver_v1alpha1.json
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: doc2vec-mcp
spec:
  transportType: http
  httpTransport:
    targetPort: 3001
    path: /mcp
  deployment:
    # Fork build with RERANKER=openrouter and RERANK_BASE_URL (Jdavid77/doc2vec, feat/openrouter-reranker)
    image: ghcr.io/jdavid77/doc2vec/mcp:2.17.5-rerank.1@sha256:10a5eecc3dc6bec6ad14eb91066ba51416bd79c76213aa5d6509fe7ae4e7afcc
    port: 3001
    imagePullPolicy: IfNotPresent
    env:
      TRANSPORT_TYPE: http
      PORT: "3001"
      VECTOR_DB_TYPE: qdrant
      QDRANT_URL: http://qdrant.automation.svc.cluster.local:6333
      # Queries must be embedded with the crawler's model (config/config.yaml)
      OPENAI_BASE_URL: http://qwen3-embedding.automation.svc.cluster.local:8080/v1
      OPENAI_MODEL: qwen3-embedding
      # Required by the server, ignored by llama.cpp
      OPENAI_API_KEY: unused
      # Keep only the best chunk of each page, so results are distinct pages
      ONE_CHUNK_PER_PAGE: "true"
      # Rerank through the llm gateway, which swaps the gateway key (OPENROUTER_API_KEY) for the real OpenRouter key
      RERANKER: openrouter
      # API base: doc2vec appends /rerank, so requests hit the llm-rerank route (POST /v1/rerank)
      RERANK_BASE_URL: http://llm.automation.svc.cluster.local/v1
      # nemotron-3.5-rerank-8b is only on OpenRouter as :free, whose safety screening rejects docs with shell/YAML examples (HTTP 422)
      RERANK_MODEL: cohere/rerank-5-pro
    secretRefs:
      - name: doc2vec-mcp-secret
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 14000
      runAsGroup: 14000
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
