# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/kagent.dev/mcpserver_v1alpha1.json
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: pushover-mcp
spec:
  transportType: http
  httpTransport:
    targetPort: 8080
    path: /mcp
  deployment:
    image: ghcr.io/jdavid77/pushover-mcp:sha-88fc677d718881d7a72656cb88ca2886b056447e@sha256:e02e47c4c4b5afb22c178dc6370a62151416c4a537544a5f874bf8c69a68df6b
    port: 8080
    labels:
      agentgateway.dev/mcp: "true"
    secretRefs:
      - name: pushover-mcp
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
