apiVersion: v1
kind: ServiceAccount
metadata:
  name: akeyless-mcp
---
# Reads which Akeyless keys the cluster references; never Secret values
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: akeyless-mcp
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "pushsecrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: akeyless-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: akeyless-mcp
subjects:
  - kind: ServiceAccount
    name: akeyless-mcp
    namespace: automation
