# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/kagent.dev/mcpserver_v1alpha1.json
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: akeyless-mcp
spec:
  transportType: http
  httpTransport:
    targetPort: 8080
    path: /mcp
  deployment:
    image: ghcr.io/jdavid77/akeyless-mcp:sha-88fc677d718881d7a72656cb88ca2886b056447e@sha256:2060a0d73258db262a7233713b0b10d59930d6ca9c29789d0f8970e0220bca96
    port: 8080
    serviceAccountName: akeyless-mcp
    labels:
      agentgateway.dev/mcp: "true"
    secretRefs:
      - name: akeyless-mcp
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
