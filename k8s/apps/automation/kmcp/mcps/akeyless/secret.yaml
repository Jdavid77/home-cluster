# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/external-secrets.io/externalsecret_v1.json
# List-only Akeyless API key (role capability "list" on /*), created by hand
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name akeyless-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: "Delete"
  dataFrom:
    - extract:
        key: /kmcp/akeyless-mcp
