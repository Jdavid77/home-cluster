# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: automation
spec:
  chart:
    spec:
      chart: kagent
      version: 0.10.1
      interval: 5m
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: kagent-charts
  install:
    crds: CreateReplace
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
  interval: 15m
  timeout: 5m
  maxHistory: 2
  rollback:
    cleanupOnFail: true
    recreate: true
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    controller:
      volumes:
        - name: kagent-secret-vol
          secret:
            secretName: kagent-secret
            items:
              - key: POSTGRES_DATABASE_URL
                path: POSTGRES_DATABASE_URL
      volumeMounts:
        - name: kagent-secret-vol
          mountPath: /secrets
          readOnly: true
      substrate:
        enabled: true
        ateApiEndpoint: "dns:///api.ate-system.svc:443"
        atenetRouterURL: "http://atenet-router.ate-system.svc:80"
        defaultWorkerPool:
          name: "default"
          namespace: "ate-system"
    substrateWorkerPool:
      # chart complains that ateomImage is needed
      # but then flux complains that workerPool doesnt have that property...
      # workerImage is the correct property, but the chart is not updated to reflect that.
      create: false
      # ateomImage: ghcr.io/kagent-dev/ateom:0.9.11
    database:
      postgres:
        bundled:
          enabled: false
        urlFile: /secrets/POSTGRES_DATABASE_URL
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: gpt-5.4-mini
        apiKeySecretRef: kagent-openai
        apiKeySecretKey: OPENAI_API_KEY
    # Enable MCP Tools
    kmcp:
      enabled: true
    kagent-tools:
      enabled: true
    grafana-mcp:
      enabled: false
    # Disable Agent CR's , converted into Sandbox Agents
    querydoc:
      enabled: false
    k8s-agent:
      enabled: false
    kgateway-agent:
      enabled: false
    helm-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    observability-agent:
      enabled: false
    promql-agent:
      enabled: false
    argo-rollouts-agent:
      enabled: false
    istio-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kagent-controller
              spec:
                template:
                  spec:
                    initContainers:
                      - name: init-db
                        image: ghcr.io/home-operations/postgres-init:18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
                        securityContext:
                          runAsUser: 65534
                        envFrom:
                          - secretRef:
                              name: kagent-secret
            target:
              kind: Deployment
              name: kagent-controller