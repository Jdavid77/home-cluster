# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kagent
  namespace: automation
spec:
  interval: 15m
  timeout: 12m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: *app
    namespace: flux-system
  values:
    # Connection strings come from kagent-postgres-owner / kagent-postgres-readwrite
    # (chart defaults), provisioned by the db-init Job in ate-system (substrate-db).
    controller:
      replicas: 2
      # Chart default maxUnavailable: 1 keeps one controller up during drains.
      pdb:
        enabled: true
      # Pod certificates + trust bundle for the Substrate API server (mTLS).
      substrateClientCertificate:
        enabled: true
    ui:
      httpRoute:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
            sectionName: websecure
        hostnames:
          - kagent.jnobrega.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
    substrateWorkerPool:
      create: true
      workerImage: "ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.1"
    # Shared Harness for all agents. Chart 1.0.0 has no `harnesses` values yet
    # (added on main after the release); switch to them once a newer chart ships.
    extraObjects:
      - apiVersion: api.kagent.dev/v1alpha3
        kind: Harness
        metadata:
          name: kagent-default
        spec:
          kagent: {}
          substrate:
            workerPoolRef:
              name: kagent-default
            snapshotPolicy:
              location: gs://agent-snapshots/kagent/
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: gpt-5.4-mini
        apiKeySecretRef: kagent-openai
        apiKeySecretKey: OPENAI_API_KEY
    kagent-tools:
      enabled: true
