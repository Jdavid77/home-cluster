# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kagent
  namespace: automation
spec:
  interval: 15m
  timeout: 12m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: *app
    namespace: flux-system
  values:
    controller:
      replicas: 2
      pdb:
        enabled: true
      substrateClientCertificate:
        enabled: true
    ui:
      httpRoute:
        enabled: true
        parentRefs:
          - name: internal
            namespace: network
            sectionName: websecure
        hostnames:
          - kagent.jnobrega.com
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
    substrateWorkerPool:
      create: true
      workerImage: "ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.1"
    # Shared Harness for all agents. Chart 1.0.0 has no `harnesses` values yet
    # (added on main after the release); switch to them once a newer chart ships.
    extraObjects:
      - apiVersion: api.kagent.dev/v1alpha3
        kind: Harness
        metadata:
          name: kagent-default
        spec:
          kagent: {}
          substrate:
            workerPoolRef:
              name: kagent-default
            snapshotPolicy:
              location: gs://agent-snapshots/kagent/
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        # Alias resolved by agentgateway (AgentgatewayModel "default"), which also holds the provider key
        model: default
        apiKeySecretRef: null
        apiKeySecretKey: null
        config:
          baseUrl: http://llm.automation.svc.cluster.local/v1
    kagent-tools:
      enabled: true
    # Every alert creates a triage session; expire idle ones after a day instead of a week
    config:
      sessions:
        idleTtl: 86400s
  # Chart 1.0.1 can't set actorJwt on the default ModelConfig: Substrate mints an actor JWT
  # at atenet-egress for model calls, which the llm gateway verifies
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ModelConfig
              name: default-model-config
            patch: |
              - op: add
                path: /spec/actorJwt
                value:
                  audiences:
                    - llm-gateway
                  expirationSeconds: 900
