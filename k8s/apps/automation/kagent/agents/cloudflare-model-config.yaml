# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/api.kagent.dev/modelconfig_v1alpha3.json
# gpt-oss-120b on the Workers AI free tier, via the llm gateway's cloudflare-gpt-oss route.
# The backend sets the model, so the name here is only a label
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: cloudflare-gpt-oss
spec:
  provider: OpenAI
  model: gpt-oss-120b
  stream: true
  openAI:
    apiFormat: chatCompletions
    baseUrl: http://llm.automation.svc.cluster.local/cloudflare/v1
  actorJwt:
    audiences:
      - llm-gateway
    expirationSeconds: 900
