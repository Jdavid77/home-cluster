# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/api.kagent.dev/agent_v1alpha3.json
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: secrets-audit-agent
spec:
  harnessRef:
    name: kagent-default
  template:
    ref:
      name: secrets-audit-agent
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/api.kagent.dev/agenttemplate_v1alpha3.json
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: secrets-audit-agent
spec:
  description: Finds Akeyless secrets that no ExternalSecret or PushSecret in the cluster references and reports them for review.
  modelConfig:
    name: default-model-config
  systemPrompt: |-
    # Akeyless Secrets Audit

    You audit the Akeyless secrets of a homelab Kubernetes cluster. You can see item names only, never secret values, and you never delete anything.

    ## Audit

    1. Call find_unused_secrets once. It returns every Akeyless item under / that no ExternalSecret or PushSecret references.
    2. Report the unused items exactly as returned. Do not add, drop or rename any.
    3. Items under /cert-manager/ may be used outside the cluster (the OMV NAS renews certificates with them). Mark them "(maybe used by OMV)".

    ## Output

    Plain text, no markdown headings or tables:

    <N> of <total_items> Akeyless secrets are not referenced by the cluster:
    - <name> (last accessed <date or "never">)
    ...
    Review before deleting.

    If nothing is unused, say "All <total_items> Akeyless secrets are in use."

    ## Delivery

    When the request comes from the weekly schedule, call send_notification exactly once with title "Akeyless audit" and the report as message (under 1000 characters; if the list does not fit, keep the first items and end with "...and <n> more"). If it fails, include the error at the end of your reply.

    In interactive chats, answer the user's question and only send a notification when asked. You may use list_items to look up names under a path.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: akeyless-mcp
        tools:
          - find_unused_secrets
          - list_items
    - mcp:
        server:
          kind: RemoteMCPServer
          name: pushover-mcp
        tools:
          - send_notification
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: secrets-audit
spec:
  parentRefs:
    - name: llm
      sectionName: agents
  rules:
    - matches:
        - path:
            type: Exact
            value: /secrets-audit
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /agents/automation/secrets-audit-agent
      backendRefs:
        - name: kagent-controller
          port: 8083
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: secrets-audit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: secrets-audit
  traffic:
    # Empty POST -> A2A SendMessage, returning as soon as the task is submitted
    transformation:
      request:
        set:
          - name: A2A-Version
            value: '"1.0"'
          - name: X-User-Id
            value: '"schedule"'
        body: |
          toJson({
            "jsonrpc": "2.0",
            "id": "1",
            "method": "SendMessage",
            "params": {
              "configuration": {"returnImmediately": true},
              "message": {
                "messageId": uuid(),
                "role": "ROLE_USER",
                "parts": [{"text": "Weekly schedule: run the Akeyless secrets audit and send the notification."}]
              }
            }
          })
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secrets-audit
spec:
  schedule: "0 10 * * 1"
  timeZone: Europe/Lisbon
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
              args: ["-fsS", "-X", "POST", "http://llm.automation.svc.cluster.local:8080/secrets-audit"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                # curl image's user is named, so runAsNonRoot needs the numeric uid
                runAsUser: 100
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                limits:
                  memory: 32Mi
