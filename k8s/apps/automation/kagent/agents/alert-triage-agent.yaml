# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/api.kagent.dev/agent_v1alpha3.json
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: alert-triage-agent
spec:
  harnessRef:
    name: kagent-default
  template:
    ref:
      name: alert-triage-agent
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/api.kagent.dev/agenttemplate_v1alpha3.json
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: alert-triage-agent
spec:
  description: Investigates a firing Alertmanager alert using read-only cluster, Flux, Prometheus and VictoriaLogs tools and returns a short likely-cause summary.
  modelConfig:
    name: default-model-config
  promptTemplate:
    dataSources:
      - alias: builtin
        name: kagent-builtin-prompts
  systemPrompt: |-
    # Alert Triage

    You receive one Alertmanager alert (or alert group) as JSON for a homelab Talos Kubernetes cluster managed by Flux CD. Investigate it and report the most likely cause. You are strictly read-only: never attempt to change, restart, scale or delete anything.

    {{include "builtin/tool-usage-best-practices"}}

    ## Investigation

    1. Read the alert labels and annotations (alertname, namespace, pod, deployment, job, instance, severity, description, summary).
    2. Check the affected workload: pod status, restarts and recent events in its namespace.
    3. Check recent Flux changes: use trace_kubernetes_resource on the affected object to find the Kustomization/HelmRelease that manages it and whether it was recently reconciled, upgraded or failed.
    4. Query Prometheus around the alert start time to confirm the signal and look for related symptoms (memory/CPU limits, OOM kills, node pressure, target down).
    5. Query VictoriaLogs for errors from the affected workload in the 15 minutes before the alert started.

    Stop once you have enough evidence. Use at most 15 tool calls.

    ## Datasources

    Call list_datasources once to get the Prometheus datasource UID.

    Logs live in VictoriaLogs and are queried with LogsQL through the query tool (start/end in RFC3339, always set limit to 50 or less). Fields keep their OpenTelemetry names with dots. Never use `namespace` or `pod`. Use:
    - `k8s.namespace.name`
    - `k8s.pod.name`
    - `k8s.container.name`
    - `k8s.deployment.name`, `k8s.statefulset.name`, `k8s.daemonset.name`, `k8s.cronjob.name`
    - `service.name`

    Example: `k8s.namespace.name:media k8s.deployment.name:jellyfin (i(error) OR i(fatal) OR i(panic))`

    ## Output

    Reply in plain text, no markdown headings or tables, at most 900 characters, in this shape:

    Cause: <one sentence, the most likely cause, or "unclear">
    Confidence: <high|medium|low>
    Evidence:
    - <short fact with the source tool>
    - <short fact>
    Next step: <one concrete action for a human>

    If the alert looks like noise or already recovered, say so in Cause.

    ## Delivery

    When done, call send_notification exactly once, with title "Triage: <alertname>" and the reply above as message (keep it under 1000 characters). This call does not count toward the tool-call limit. If it fails, include the error at the end of your reply.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kubernetes-mcp
        tools:
          - events_list
          - namespaces_list
          - nodes_top
          - pods_get
          - pods_list_in_namespace
          - pods_log
          - pods_top
          - resources_get
          - resources_list
    - mcp:
        server:
          kind: RemoteMCPServer
          name: flux-mcp
        tools:
          - get_flux_instance
          - get_kubernetes_events
          - get_kubernetes_resources
          - trace_kubernetes_resource
    - mcp:
        server:
          kind: RemoteMCPServer
          name: grafana-mcp
        tools:
          - list_datasources
          - list_prometheus_metric_names
          - query_prometheus
    - mcp:
        server:
          kind: RemoteMCPServer
          name: victorialogs-mcp
        tools:
          - query
          - field_values
    - mcp:
        server:
          kind: RemoteMCPServer
          name: pushover-mcp
        tools:
          - send_notification
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alert-triage
spec:
  parentRefs:
    - name: llm
      sectionName: agents
  rules:
    - matches:
        - path:
            type: Exact
            value: /alert-triage
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /agents/automation/alert-triage-agent
      backendRefs:
        - name: kagent-controller
          port: 8083
---
# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/agentgateway.dev/agentgatewaypolicy_v1alpha1.json
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: alert-triage
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alert-triage
  traffic:
    # Alertmanager webhook payload -> A2A SendMessage, returning as soon as the task is submitted
    transformation:
      request:
        set:
          - name: A2A-Version
            value: '"1.0"'
          - name: X-User-Id
            value: '"alertmanager"'
        body: |
          toJson({
            "jsonrpc": "2.0",
            "id": "1",
            "method": "SendMessage",
            "params": {
              "configuration": {"returnImmediately": true},
              "message": {
                "messageId": uuid(),
                "role": "ROLE_USER",
                "parts": [{"text": "Triage this Alertmanager webhook payload:\n" + string(request.body)}]
              }
            }
          })
