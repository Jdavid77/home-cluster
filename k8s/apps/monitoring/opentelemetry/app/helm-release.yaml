      image:
        repository: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator
        tag: v0.158.0@sha256:e056769dd02878d7e3f91e879c0f168613b4763f2601ebb949f0917e6527bf9c
      collectorImage:
        repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
        tag: 0.158.0@sha256:e290476fa9a75f7a84a28798832bde7068d27825745de67bc38957e22949a64c
    admissionWebhooks:
      certManager:
        enabled: false
