# yaml-language-server: $schema=https://k8s-schemas-jnobrega.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  values:
    controllers:
      paperless:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 19.0@sha256:b49e2f1f373d932ab41614633ac89fa506e5d21bb13cc18d9c96ca026e51f502
            envFrom: &envFrom
              - secretRef:
                  name: paperless-secret
        containers:
          paperless:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
            env:
              COMPOSE_PROJECT_NAME: paperless
              PAPERLESS_CONSUMER_POLLING: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              PAPERLESS_ENABLE_HTTP_REMOTE_USER: "false"
              PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
              PAPERLESS_OCR_LANGUAGES: por
              PAPERLESS_OCR_LANGUAGE: por
              PAPERLESS_PORT: &port 8000
              PAPERLESS_DBNAME: paperless
              PAPERLESS_REDIS: redis://dragonfly-paperless.documents.svc.cluster.local:6379
              PAPERLESS_TASK_WORKERS: 2
              PAPERLESS_TIME_ZONE: Europe/Lisbon
              PAPERLESS_URL: https://paperless.jnobrega.com
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'
            envFrom: *envFrom
            resources:
              requests:
                cpu: 100m
                memory: 1239M
              limits:
                cpu: 250m
                memory: 5000M
    service:
      paperless:
        controller: *app
        ports:
          http:
            port: 8000
    route:
      main:
        parentRefs:
          - kind: Gateway
            name: internal
            namespace: network
            sectionName: websecure
        hostnames:
          - paperless.jnobrega.com
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      data:
        type: nfs
        server: 192.168.1.84
        path: /k8s/paperless-data
        globalMounts:
          - path: /usr/src/paperless/data
      media:
        type: nfs
        server: 192.168.1.84
        path: /k8s/paperless-media
        globalMounts:
          - path: /usr/src/paperless/media
      consume:
        type: nfs
        server: 192.168.1.84
        path: /k8s/paperless-consume
        globalMounts:
          - path: /usr/src/paperless/consume
      export:
        type: nfs
        server: 192.168.1.84
        path: /k8s/paperless-export
        globalMounts:
          - path: /usr/src/paperless/export
